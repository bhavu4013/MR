function digit(v) {
  if (v === undefined || v === null || v === &amp;quot;&amp;quot;) return null;
  const n = parseInt(v, 10);
  return Number.isFinite(n) ? ((n % 10) + 10) % 10 : null;
}

function jodiOf(r) {
  const o = digit(r.openAnk ?? r.openDigit ?? r.open);
  const c = digit(r.closeAnk ?? r.closeDigit ?? r.close);
  return o === null || c === null ? null : String(o) + String(c);
}

function timeMin(s) {
  if (!s) return 1439;
  const m = String(s).match(/(\\d{1,2}):(\\d{2})/);
  return m ? parseInt(m[1],10) * 60 + parseInt(m[2],10) : 1439;
}

function dateValue(v) {
  if (v &amp;amp;&amp;amp; typeof v.toDate === &amp;quot;function&amp;quot;) {
    const d = v.toDate();
    return d instanceof Date &amp;amp;&amp;amp; !isNaN(d) ? d.getTime() : 0;
  }
  if (v &amp;amp;&amp;amp; typeof v.seconds === &amp;quot;number&amp;quot;) return v.seconds * 1000;
  const d = new Date(v);
  return d instanceof Date &amp;amp;&amp;amp; !isNaN(d) ? d.getTime() : 0;
}

function sortRows(rows) {
  return rows.slice().sort((a,b) =&amp;gt;
    dateValue(a.date) - dateValue(b.date) ||
    timeMin(a.openTime) - timeMin(b.openTime)
  );
}

function calculate() {
  const selected = el.market.value || &amp;quot;ALL_MERGED&amp;quot;;

  // Only completed Jodi results are counted.
  // A completed game = Open + Close both available.
  const rows = sortRows(
    allRows
      .filter(r =&amp;gt; selected === &amp;quot;ALL_MERGED&amp;quot; || r.marketName === selected)
      .filter(r =&amp;gt; jodiOf(r) !== null)
  );

  const n = rows.length;
  modalHistoryCount = n;

  stats = Object.fromEntries(groups.map(g =&amp;gt; [g, {
    occurrences: [],
    currentDelay: n,
    maxDelay: n,
    lastSeen: -1,
    count: 0
  }]));

  /*
    LOCKED FAMILY JODI DELAY RULE:

    If the Jodi of a completed game belongs to a Family-Jodi group,
    THAT GROUP is considered HIT for that game.

    Example:
      Group 12 contains 12,17,21,26,62,67,71,76.
      If today&amp;#x27;s complete Jodi is 67,
      Group 12 HIT =&amp;gt; Group 12 Delay = 0.

    The next completed game without any Group-12 Jodi:
      Delay = 1
    next:
      Delay = 2
    next:
      Delay = 3

    So delay is ALWAYS reset by the latest Jodi hit of that group.
  */

  // Build a direct Jodi -&amp;gt; Family Group map.
  // Every Jodi belongs to exactly one locked Family Group.
  const jodiToGroup = {};
  groups.forEach(g =&amp;gt; {
    FAMILY_JODI_GROUPS[g].forEach(j =&amp;gt; {
      jodiToGroup[String(j).padStart(2, &amp;quot;0&amp;quot;)] = g;
    });
  });

  // Record EVERY hit of each Family Group.
  // A group is hit when ANY Jodi/member belonging to that group occurs.
  rows.forEach((r, i) =&amp;gt; {
    const j = jodiOf(r);
    const group = jodiToGroup[j];

    if (group) {
      stats[group].occurrences.push(i);
      stats[group].lastSeen = i;
      stats[group].count++;
    }
  });

  groups.forEach(g =&amp;gt; {
    const s = stats[g];
    const hits = s.occurrences;

    // EXACT GROUP DELAY COUNT:
    // Find the latest hit of ANY member Jodi in this Family Group.
    // Group delay = completed games since that latest group hit.
    s.currentDelay = hits.length
      ? n - 1 - hits[hits.length - 1]
      : n;

    // Keep Max Delay only as informational data.
    const gaps = hits.length ? [hits[0]] : [n];

    for (let i = 1; i &amp;lt; hits.length; i++) {
      gaps.push(hits[i] - hits[i - 1] - 1);
    }

    if (hits.length) {
      gaps.push(n - 1 - hits[hits.length - 1]);
    }

    s.maxDelay = Math.max(0, ...gaps);
  });

  const arr = groups.map(g =&amp;gt; ({ group: g, ...stats[g] }));

  // TOP/MID/RECENT are based ONLY on the 15 FAMILY GROUP names
  // and their GROUP DELAY COUNT.
  // Max Delay is NOT used for this classification.
  const delaySorted = arr.slice().sort((a, b) =&amp;gt;
    b.currentDelay - a.currentDelay ||
    a.group.localeCompare(b.group)
  );

  top5 = delaySorted.slice(0, 5);
  mid5 = delaySorted.slice(5, 10);
  recent5 = delaySorted.slice(10, 15);

  // Category delay uses the latest hit of ANY member in the category,
  // exactly like the uploaded Open Digit Analysis page.
  function getGroupDelay(list) {
    const lastSeen = list.reduce(
      (mx, x) =&amp;gt; Math.max(mx, Number.isFinite(x.lastSeen) ? x.lastSeen : -1),
      -1
    );
    return lastSeen &amp;gt;= 0 ? Math.max(0, n - 1 - lastSeen) : n;
  }

  el.topDelaySummary.textContent =
    `DELAY: ${getGroupDelay(top5)}`;
  el.midDelaySummary.textContent =
    `DELAY: ${getGroupDelay(mid5)}`;
  el.recentDelaySummary.textContent =
    `DELAY: ${getGroupDelay(recent5)}`;

  renderGroups(arr, &amp;quot;ALL&amp;quot;);

  setStatus(
    `${n} completed Jodi games • Group hit = any member Jodi occurred`
  );
}

function analyzeDigitJodis(d){
  // Same TOP/MID/RECENT movement + group-counter logic as Digit Analysis,
  // adapted from one Digit to the 10 Jodis belonging to that Digit.
  const digitKey=String(d);
  const items=Array.from({length:10},(_,c)=&amp;gt;digitKey+String(c));
  const selected=el.market.value||&amp;quot;ALL_MERGED&amp;quot;;
  const rows=sortRows(allRows.filter(r=&amp;gt;(selected===&amp;quot;ALL_MERGED&amp;quot;||r.marketName===selected)).filter(r=&amp;gt;jodiOf(r)!==null));

  const makeStats=history=&amp;gt;{
    const n=history.length;
    const a=Object.fromEntries(items.map(j=&amp;gt;[j,{jodi:j,occ:[],lastSeen:-1,count:0,currentDelay:n,maxDelay:0}]));
    history.forEach((r,i)=&amp;gt;{const j=jodiOf(r);if(a[j]){a[j].occ.push(i);a[j].lastSeen=i;a[j].count++;}});
    items.forEach(j=&amp;gt;{
      const x=a[j],o=x.occ;
      x.currentDelay=o.length?n-1-o[o.length-1]:n;
      const gaps=o.length?[o[0]]:[n];
      for(let i=1;i&amp;lt;o.length;i++)gaps.push(o[i]-o[i-1]-1);
      if(o.length)gaps.push(n-1-o[o.length-1]);
      x.maxDelay=Math.max(0,...gaps);
    });
    return a;
  };

  const rank=history=&amp;gt;Object.values(makeStats(history)).sort((a,b)=&amp;gt;
    b.currentDelay-a.currentDelay||b.maxDelay-a.maxDelay||b.count-a.count||a.jodi.localeCompare(b.jodi)
  );
  const uniq=arr=&amp;gt;{const out=[];for(const x of arr){if(x&amp;amp;&amp;amp;!out.some(y=&amp;gt;y.jodi===x.jodi))out.push(x);}return out;};
  const most=(arr,exclude=[])=&amp;gt;arr.filter(x=&amp;gt;x&amp;amp;&amp;amp;!exclude.includes(x.jodi)).slice().sort((a,b)=&amp;gt;
    b.currentDelay-a.currentDelay||b.maxDelay-a.maxDelay||b.count-a.count||a.jodi.localeCompare(b.jodi)
  )[0]||null;

  const previous=rows.slice(0,-1);
  const ranked=rank(previous);
  let top=ranked.slice(0,3),mid=ranked.slice(3,7),recent=ranked.slice(7,10);

  const bucketDelay=list=&amp;gt;{
    const last=(list||[]).reduce((mx,x)=&amp;gt;Math.max(mx,Number.isFinite(x?.lastSeen)?x.lastSeen:-1),-1);
    return last&amp;gt;=0?Math.max(0,previous.length-1-last):previous.length;
  };
  let delay={top:bucketDelay(top),mid:bucketDelay(mid),recent:bucketDelay(recent)};

  const hit=rows.length?jodiOf(rows[rows.length-1]):null;
  const source=hit!==null&amp;amp;&amp;amp;items.includes(hit)
    ?(top.some(x=&amp;gt;x.jodi===hit)?&amp;quot;TOP&amp;quot;:mid.some(x=&amp;gt;x.jodi===hit)?&amp;quot;MID&amp;quot;:recent.some(x=&amp;gt;x.jodi===hit)?&amp;quot;RECENT&amp;quot;:&amp;quot;NONE&amp;quot;)
    :&amp;quot;NONE&amp;quot;;

  // EXACT Digit Analysis movement rules.
  if(source===&amp;#x27;TOP&amp;#x27;){
    const hitObj=top.find(x=&amp;gt;x.jodi===hit);
    top=top.filter(x=&amp;gt;x.jodi!==hit);
    const rToMid=most(recent,[hit]);
    if(rToMid)recent=recent.filter(x=&amp;gt;x.jodi!==rToMid.jodi);
    if(rToMid)mid=uniq([...mid,rToMid]);
    const mToTop=most(mid,[hit]);
    if(mToTop)mid=mid.filter(x=&amp;gt;x.jodi!==mToTop.jodi);
    if(mToTop)top=uniq([...top,mToTop]);
    if(hitObj)recent=uniq([...recent,hitObj]);
  }else if(source===&amp;#x27;MID&amp;#x27;){
    const hitObj=mid.find(x=&amp;gt;x.jodi===hit);
    mid=mid.filter(x=&amp;gt;x.jodi!==hit);
    const rToMid=most(recent,[hit]);
    if(rToMid)recent=recent.filter(x=&amp;gt;x.jodi!==rToMid.jodi);
    if(rToMid)mid=uniq([...mid,rToMid]);
    if(hitObj)recent=uniq([...recent,hitObj]);
  }else if(source===&amp;#x27;RECENT&amp;#x27;){
    recent=uniq(recent);
  }

  const used=new Set([...top,...mid,...recent].map(x=&amp;gt;x.jodi));
  const fill=(bucket,size)=&amp;gt;{for(const x of ranked){if(bucket.length&amp;gt;=size)break;if(!used.has(x.jodi)){bucket.push(x);used.add(x.jodi);}}return bucket;};
  top=fill(uniq(top),3);mid=fill(uniq(mid),4);recent=fill(uniq(recent),3);

  // Group counters are independent from individual Jodi delay.
  delay=source===&amp;#x27;TOP&amp;#x27;
    ?{top:0,mid:delay.mid+1,recent:delay.recent+1}
    :source===&amp;#x27;MID&amp;#x27;
    ?{top:delay.top+1,mid:0,recent:delay.recent+1}
    :source===&amp;#x27;RECENT&amp;#x27;
    ?{top:delay.top+1,mid:delay.mid+1,recent:0}
    :{top:delay.top+1,mid:delay.mid+1,recent:delay.recent+1};

  const currentStats=makeStats(rows);
  return {digit:d,items,all:items.map(j=&amp;gt;currentStats[j]),stats:currentStats,top,mid,recent,delay,historyCount:rows.length};
}

function modalGroupDelay(list){
  const a=modalDigitState.groups;
  if(!a)return 0;
  if(list===a.top)return Number(a.delay?.top||0);
  if(list===a.mid)return Number(a.delay?.mid||0);
  if(list===a.recent)return Number(a.delay?.recent||0);
  return Number(a.historyCount||0);
}

    row.innerHTML=`&amp;lt;div class=&amp;quot;flex items-center justify-between gap-2&amp;quot;&amp;gt;&amp;lt;div class=&amp;quot;flex items-center gap-2&amp;quot;&amp;gt;&amp;lt;span class=&amp;quot;text-lg font-black&amp;quot;&amp;gt;${x.jodi}&amp;lt;/span&amp;gt;&amp;lt;span class=&amp;quot;text-[7px] font-black ${cls===&amp;#x27;top&amp;#x27;?&amp;#x27;text-orange-700&amp;#x27;:cls===&amp;#x27;mid&amp;#x27;?&amp;#x27;text-indigo-700&amp;#x27;:cls===&amp;#x27;recent&amp;#x27;?&amp;#x27;text-emerald-700&amp;#x27;:&amp;#x27;text-slate-500&amp;#x27;}&amp;quot;&amp;gt;${group}&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div class=&amp;quot;text-right&amp;quot;&amp;gt;&amp;lt;div class=&amp;quot;text-[10px] font-black text-indigo-700&amp;quot;&amp;gt;DELAY: ${x.currentDelay}&amp;lt;/div&amp;gt;&amp;lt;div class=&amp;quot;text-[9px] font-bold text-slate-500&amp;quot;&amp;gt;MAX DELAY: ${x.maxDelay}&amp;lt;/div&amp;gt;&amp;lt;div class=&amp;quot;text-[8px] font-bold text-slate-400&amp;quot;&amp;gt;HITS: ${x.count}&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;`;
    body.appendChild(row);
  });
}

const $=id=&gt;document.getElementById(id);let allRows=[],stats={},top10=[],mid10=[],recent10=[],groupDelayState={top:0,mid:0,recent:0},view=&quot;ALL&quot;,mode=&quot;OPEN&quot;;
function digit(v){

function calculate(){

const DB1=&quot;AnalysisPlatform_MASTER_LOCAL_DB_20260918_V38&quot;,DB2=&quot;AnalysisPlatform_MASTER_COMPAT_DB_20260918_V38&quot;;
function openLocalDB(name){return new Promise((resolve,reject)=>{
  const required=name===DB1?[&quot;markets&quot;,&quot;matka_records&quot;,&quot;masterData&quot;]:[&quot;docs&quot;];
  const first=indexedDB.open(name);
  first.onupgradeneeded=()=>{const d=first.result;for(const n of required){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:n===&quot;docs&quot;?&quot;key&quot;:&quot;id&quot;})}};

    up.onerror=()=>reject(up.error||new Error(&quot;Local database upgrade failed: &quot;+name));
    up.onblocked=()=>reject(new Error(&quot;Local database upgrade blocked. Close other copies of this app and retry.&quot;));
  };
  first.onerror=()=>reject(first.error||new Error(&quot;Local database open failed: &quot;+name));
  first.onblocked=()=>reject(new Error(&quot;Local database open blocked. Close other copies of this app and retry.&quot;));
})}

async function readCollection(collection){
  if(collection===&#x27;markets&#x27;||collection===&#x27;matka_records&#x27;){
    const a=await readStore(DB1,collection);
    const b=await readStore(DB2,&#x27;docs&#x27;);
    const bb=b.filter(x=&gt;x.data &amp;&amp; x.data.__collection===collection);
    const seen=new Set(a.map(x=&gt;x.id));
    for(const x of bb)if(!seen.has(x.id)){a.push(x);seen.add(x.id)}
    return a;
  }
  return [];
}
async function readDB2Collection(collection){const db=await openDB(DB2);return new Promise((resolve,reject)=&gt;{const tx=db.transaction(&#x27;docs&#x27;,&#x27;readonly&#x27;),st=tx.objectStore(&#x27;docs&#x27;),arr=[];const req=st.openCursor();req.onsuccess=()=&gt;{const c=req.result;if(c){if(c.value.collection===collection)arr.push({id:String(c.value.id),data:c.value.data||{}});c.continue();}else resolve(arr)};req.onerror=()=&gt;reject(req.error)});}
async function writePrimary(collection,id,data){const db=await openDB(DB1);return new Promise((resolve,reject)=&gt;{const tx=db.transaction(collection,&#x27;readwrite&#x27;);tx.objectStore(collection).put({...data,id});tx.oncomplete=resolve;tx.onerror=()=&gt;reject(tx.error||new Error(&#x27;Write failed&#x27;));});}
async function writeSecondary(collection,id,data){const db=await openDB(DB2);return new Promise((resolve,reject)=&gt;{const tx=db.transaction(&#x27;docs&#x27;,&#x27;readwrite&#x27;);tx.objectStore(&#x27;docs&#x27;).put({key:collection+&#x27;/&#x27;+id,collection,id:String(id),data:data||{}},collection+&#x27;/&#x27;+id);tx.oncomplete=resolve;tx.onerror=()=&gt;reject(tx.error||new Error(&#x27;Write failed&#x27;));});}
function newId(){return &#x27;local_&#x27;+Date.now().toString(36)+&#x27;_&#x27;+Math.random().toString(36).slice(2,10)}
function recordKey(r){return String(r.date||&#x27;&#x27;)+&#x27;|&#x27;+String(r.marketName||&#x27;&#x27;).trim().toLowerCase()}
function marketKey(r){return String(r.name||&#x27;&#x27;).trim().toLowerCase()}
async function refresh(){
  try{ $(&#x27;status&#x27;).textContent=&#x27;Reading local database...&#x27;; const ms=await readCollection(&#x27;markets&#x27;); const rs=await readCollection(&#x27;matka_records&#x27;); $(&#x27;marketCount&#x27;).textContent=ms.length; $(&#x27;recordCount&#x27;).textContent=rs.length; $(&#x27;dbInfo&#x27;).textContent=&#x27;AnalysisPlatform_MASTER_LOCAL_DB_20260918_V38 + compatible local store • &#x27;+new Date().toLocaleString(); $(&#x27;status&#x27;).textContent=&#x27;LOCAL DATABASE READY&#x27;; }
  catch(e){console.error(e);$(&#x27;status&#x27;).textContent=&#x27;ERROR: &#x27;+e.message}
}
async function exportBackup(){
  try{ $(&#x27;status&#x27;).textContent=&#x27;Preparing backup...&#x27;; const markets=await readCollection(&#x27;markets&#x27;); const records=await readCollection(&#x27;matka_records&#x27;); const backup={format:&#x27;Analysis Platform Local Database Backup&#x27;,version:1,exportedAt:new Date().toISOString(),markets,matka_records:records}; const blob=new Blob([JSON.stringify(backup,null,2)],{type:&#x27;application/json&#x27;}); const a=document.createElement(&#x27;a&#x27;);a.href=URL.createObjectURL(blob);a.download=&#x27;analysis-platform-backup-&#x27;+new Date().toISOString().slice(0,10)+&#x27;.json&#x27;;document.body.appendChild(a);a.click();a.remove();setTimeout(()=&gt;URL.revokeObjectURL(a.href),1000);$(&#x27;result&#x27;).textContent=&#x27;✓ Backup exported: &#x27;+markets.length+&#x27; markets • &#x27;+records.length+&#x27; records&#x27;;$(&#x27;status&#x27;).textContent=&#x27;BACKUP READY&#x27;;}
  catch(e){console.error(e);$(&#x27;status&#x27;).textContent=&#x27;EXPORT ERROR: &#x27;+e.message}
}
$(&#x27;fileInput&#x27;).onchange=async e=&gt;{selectedBackup=null;$(&#x27;importBtn&#x27;).disabled=true;$(&#x27;importPreview&#x27;).textContent=&#x27;No backup selected.&#x27;;const f=e.target.files&amp;&amp;e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data||!Array.isArray(data.matka_records)||!Array.isArray(data.markets))throw new Error(&#x27;Invalid backup file&#x27;);selectedBackup=data;$(&#x27;importPreview&#x27;).textContent=&#x27;Selected: &#x27;+f.name+&#x27; • &#x27;+data.markets.length+&#x27; markets • &#x27;+data.matka_records.length+&#x27; records&#x27;;$(&#x27;importBtn&#x27;).disabled=false;}catch(err){$(&#x27;importPreview&#x27;).textContent=&#x27;Invalid JSON backup: &#x27;+err.message;}};
$(&#x27;importBtn&#x27;).onclick=async()=&gt;{if(!selectedBackup)return;if(!confirm(&#x27;Import this backup? Existing Date + Market records will be skipped.&#x27;))return;try{$(&#x27;status&#x27;).textContent=&#x27;Importing...&#x27;;let existingM=await readCollection(&#x27;markets&#x27;),existingR=await readCollection(&#x27;matka_records&#x27;);const mMap=new Map(existingM.map(x=&gt;[marketKey(x.data),x]));const rMap=new Map(existingR.map(x=&gt;[recordKey(x.data),x]));let mAdded=0,mUpdated=0,rAdded=0,rSkipped=0;for(const item of selectedBackup.markets){const d=item&amp;&amp;item.data?item.data:item||{};const key=marketKey(d);if(!key)continue;const old=mMap.get(key);const id=old?old.id:String(item.id||newId());const merged=old?{...old.data,...d}:d;await writePrimary(&#x27;markets&#x27;,id,merged);await writeSecondary(&#x27;markets&#x27;,id,merged);if(old)mUpdated++;else{mAdded++;mMap.set(key,{id,data:merged});}}
for(const item of selectedBackup.matka_records){const d=item&amp;&amp;item.data?item.data:item||{};const key=recordKey(d);if(!key||!d.date||!d.marketName)continue;if(rMap.has(key)){rSkipped++;continue}const id=String(item.id||newId());await writePrimary(&#x27;matka_records&#x27;,id,d);await writeSecondary(&#x27;matka_records&#x27;,id,{...d,__collection:&#x27;matka_records&#x27;});rAdded++;rMap.set(key,{id,data:d});}
$(&#x27;result&#x27;).textContent=&#x27;✓ Import complete • Markets added &#x27;+mAdded+&#x27; • updated &#x27;+mUpdated+&#x27; • Records added &#x27;+rAdded+&#x27; • duplicate records skipped &#x27;+rSkipped;$(&#x27;status&#x27;).textContent=&#x27;IMPORT COMPLETE&#x27;;selectedBackup=null;$(&#x27;importBtn&#x27;).disabled=true;$(&#x27;fileInput&#x27;).value=&#x27;&#x27;;await refresh();}
catch(e){console.error(e);$(&#x27;status&#x27;).textContent=&#x27;IMPORT ERROR: &#x27;+e.message;}}
$(&#x27;exportBtn&#x27;).onclick=exportBackup;$(&#x27;refreshBtn&#x27;).onclick=refresh;refresh();

<script>

const morePages=[0,1,2,3,4,5,6,12];
function openPage(index){
 buttons.forEach(b=>b.classList.toggle('active',Number(b.dataset.page)===index));
 if(moreNav)moreNav.classList.toggle('active',morePages.includes(index));
 if(morePanel)morePanel.classList.remove('show');

 try{localStorage.setItem('analysisPlatformPageV8',String(index));}catch(e){}

 }
}
